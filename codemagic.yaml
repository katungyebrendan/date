workflows:
  ios-release:
    name: iOS Release
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: App Store Connect
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.kats.velo
      flutter: stable
      xcode: latest
    scripts:
      - name: Get Flutter packages
        script: cd date && flutter pub get
      - name: Install CocoaPods dependencies
        script: cd date/ios && pod install
      - name: Apply iOS signing profiles
        script: cd date && xcode-project use-profiles
      - name: Build signed IPA
        script: cd date && flutter build ipa --release --build-number="$BUILD_NUMBER" --export-options-plist="$HOME/export_options.plist"
    artifacts:
      - date/build/ios/ipa/*.ipa
      - date/build/ios/archive/*.xcarchive
      - /tmp/xcodebuild_logs/**/*.log